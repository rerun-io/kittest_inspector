[package]
name = "kittest_inspector"
version.workspace = true
authors.workspace = true
description = "Live inspector eframe app for egui_kittest tests (frame + accesskit tree + step controls)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories = ["gui", "development-tools::testing"]
keywords = ["egui", "kittest", "testing", "inspector"]
readme = "README.md"
include = [
    "../../LICENSE-APACHE",
    "../../LICENSE-MIT",
    "**/*.rs",
    "Cargo.toml",
    "README.md",
    "tests/snapshots/inspector_renders_frame.png",
]
publish = false

[[bin]]
name = "kittest_inspector"
path = "src/main.rs"

# We'll need to add some more features to the inspection protocol before we can get the inspector updated to main
[dependencies]
eframe = { workspace = true }
egui_kittest = { workspace = true }
fs4 = { workspace = true }
image = { workspace = true }
# Cross-platform clipboard — same crate eframe uses — with `set_file_list` so apps that
# accept pasted files (Slack, Discord, Finder, etc.) attach the GIF with animation intact.
arboard = { workspace = true }


[dev-dependencies]
# Launch the inspector under egui_kittest for integration tests. `eframe` lets us wrap
# `InspectorApp` directly; `wgpu` + `snapshot` provide the renderer + `Harness::snapshot`.
egui_kittest = { workspace = true, features = ["eframe", "wgpu", "snapshot", "inspector"] }
# Same source as the `[dependencies]` entry — cargo unifies them, and duplicating the
# declaration keeps tests able to name `eframe` (and `eframe::egui`) directly.
eframe = { workspace = true }


[lints]
workspace = true
